name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - libs/common
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: ${{ matrix.component }}/poetry.lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Unit tests
        run: poetry run pytest -q

  # An `integration` job (pgvector service container, RUN_INTEGRATION=1, PRs only) is
  # added in Phase 1 together with the first integration tests — an empty job would
  # only produce a misleading green/red signal until then.
