name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `package` is what coverage measures; `min-coverage` is a ratchet set just
        # below each component's current number — it exists to catch rot, not to chase
        # a target. Raise a floor when a component durably improves; never lower one
        # without saying why in the PR.
        include:
          - component: libs/common
            package: pokedex_common
            min-coverage: 95
          - component: libs/db
            package: pokedex_db
            min-coverage: 95
          - component: libs/embeddings
            package: pokedex_embeddings
            min-coverage: 90
          - component: libs/llm-gateway
            package: pokedex_llm
            min-coverage: 90
          - component: apps/data-pipeline
            package: pipeline
            min-coverage: 85
          - component: apps/api
            package: api
            min-coverage: 85
          - component: apps/evals
            package: evals
            min-coverage: 85
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: ${{ matrix.component }}/poetry.lock

      - name: Install dependencies
        # Default groups only: the optional `local` group pulls torch (~300 MB) and is
        # never needed by the offline suite.
        run: poetry install --no-interaction

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Unit tests with coverage
        run: >
          poetry run pytest -q
          --cov=${{ matrix.package }}
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=${{ matrix.min-coverage }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: ${{ matrix.component }}/coverage.xml
          if-no-files-found: warn

  web:
    # apps/web is a Node component, so it gets its own job rather than a slot in the
    # Poetry matrix. The build is part of the gate: a static export can fail on things
    # the unit tests never touch (a missing generateStaticParams, a server-only import).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: |
          pnpm lint
          pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Static export builds
        run: pnpm build

  pipeline-integrity:
    # Runs the ENTIRE eval runner against a deterministic offline fake: no API, no
    # database, no credentials, no spend. It catches the breakages a unit test suite
    # structurally cannot — a malformed golden YAML, a renamed response field, a suite
    # branch that crashes — before a paid live run ever discovers them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/evals
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: apps/evals/poetry.lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Golden cases parse and are unique
        run: poetry run evals list-cases

      - name: Every suite runs end to end on fakes
        run: |
          set -euo pipefail
          poetry run evals run --fake-api | tee run.log
          grep -q "suite averages" run.log

      - name: Comparison pipeline runs end to end on fakes
        run: |
          set -euo pipefail
          poetry run evals compare --fake-api | tee compare.log
          grep -q "provider(s)" compare.log

  images:
    # Regression guard for a real bug (Phase 6.6): all three Dockerfiles copied only a
    # SUBSET of the libs/ their pyproject declares as path dependencies, so none of them
    # could build — invisible for several phases because nothing in CI ever built an
    # image. Unit tests and `poetry run` pass happily while the container is broken.
    # The api image is also started and probed: a build that succeeds can still fail to
    # boot (a wrong CMD, a missing runtime file), and /health is the cheapest proof.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, data-pipeline, evals]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.component }} image
        # Repo root as context so libs/ is reachable, exactly as the READMEs document.
        run: docker build -f apps/${{ matrix.component }}/Dockerfile -t pokedex-${{ matrix.component }}:ci .

      - name: The api image boots and serves /health
        if: matrix.component == 'api'
        run: |
          set -euo pipefail
          docker run -d --name api-smoke -p 8080:8080 -e PORT=8080 \
            -e DATABASE_URL='sqlite+pysqlite:///:memory:' pokedex-api:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs api-smoke
          test "$code" = "200"
          docker rm -f api-smoke

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        component:
          - libs/db
          - apps/data-pipeline
          - apps/api
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: pokedex
          POSTGRES_PASSWORD: pokedex
          POSTGRES_DB: pokedex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokedex -d pokedex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_INTEGRATION: "1"
      DATABASE_URL: postgresql+psycopg://pokedex:pokedex@localhost:5432/pokedex
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: ${{ matrix.component }}/poetry.lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Tests (unit + integration)
        run: poetry run pytest -q
