services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: pokedex-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
    ports:
      # Host default is 5433: a PostgreSQL inside WSL owns 5432 on this machine and
      # WSL2's shared VM network makes it shadow the container's published port.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokedex} -d ${POSTGRES_DB:-pokedex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pokedex-api:local
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokedex}:${POSTGRES_PASSWORD:-pokedex}@db:5432/${POSTGRES_DB:-pokedex}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_LOCATION: ${EMBEDDING_LOCATION:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_SPACE_LABEL: ${EMBEDDING_SPACE_LABEL:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GENERATION_LOCATION: ${GENERATION_LOCATION:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LLM_PRIMARY: ${LLM_PRIMARY:-vertex-gemini}
      LLM_FALLBACK: ${LLM_FALLBACK:-}
      AI_STUDIO_API_KEY: ${AI_STUDIO_API_KEY:-}
      AI_STUDIO_MODEL: ${AI_STUDIO_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      db:
        condition: service_healthy

  # One-shot migration job (same image as the data pipeline). Not started by default:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: apps/data-pipeline/Dockerfile
    image: pokedex-data-pipeline:local
    profiles: ["tools"]
    command: ["db", "upgrade"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokedex}:${POSTGRES_PASSWORD:-pokedex}@db:5432/${POSTGRES_DB:-pokedex}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
