services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: pokedex-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
    ports:
      # Host default is 5433: a PostgreSQL inside WSL owns 5432 on this machine and
      # WSL2's shared VM network makes it shadow the container's published port.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokedex} -d ${POSTGRES_DB:-pokedex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration job (same image as the data pipeline). Not started by default:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: apps/data-pipeline/Dockerfile
    image: pokedex-data-pipeline:local
    profiles: ["tools"]
    command: ["db", "upgrade"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokedex}:${POSTGRES_PASSWORD:-pokedex}@db:5432/${POSTGRES_DB:-pokedex}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
