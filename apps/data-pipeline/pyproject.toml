[project]
name = "pokedex-data-pipeline"
version = "0.1.0"
description = "Batch job: PokéAPI ingestion, document building, embeddings and DB migrations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer (>=0.15,<1.0)",
    "alembic (>=1.13,<2.0)",
    "pokedex-common",
    "pokedex-db",
    "httpx (>=0.28.1,<0.29.0)",
    "pokedex-embeddings",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.poetry]
packages = [{ include = "pipeline", from = "src" }]

[tool.poetry.dependencies]
pokedex-common = { path = "../../libs/common", develop = true }
pokedex-db = { path = "../../libs/db", develop = true }
pokedex-embeddings = { path = "../../libs/embeddings", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=6.0,<8.0"
ruff = ">=0.8,<1.0"
respx = "^0.23.1"

# Opt-in (poetry install --with local): torch-heavy, only needed to run
# `pipeline embed --space embeddinggemma-768-v1` (Phase 6.1). Unit tests use fakes.
[tool.poetry.group.local]
optional = true

[tool.poetry.group.local.dependencies]
sentence-transformers = ">=5.0,<6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials or external APIs, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
