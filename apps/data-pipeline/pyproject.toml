[project]
name = "pokedex-data-pipeline"
version = "0.1.0"
description = "Batch job: PokéAPI ingestion, document building, embeddings and DB migrations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer (>=0.15,<1.0)",
    "alembic (>=1.13,<2.0)",
    "pokedex-common",
    "pokedex-db",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.poetry]
packages = [{ include = "pipeline", from = "src" }]

[tool.poetry.dependencies]
pokedex-common = { path = "../../libs/common", develop = true }
pokedex-db = { path = "../../libs/db", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
ruff = ">=0.8,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials or external APIs, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
