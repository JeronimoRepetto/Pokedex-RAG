[project]
name = "pokedex-evals"
version = "0.1.0"
description = "Batch job: golden-dataset evaluation runner against the Pokédex AI API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer (>=0.15,<1.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyyaml (>=6.0,<7.0)",
    "pokedex-common",
    "pokedex-db",
]

[project.scripts]
evals = "evals.cli:app"

[tool.poetry]
packages = [{ include = "evals", from = "src" }]

[tool.poetry.dependencies]
pokedex-common = { path = "../../libs/common", develop = true }
pokedex-db = { path = "../../libs/db", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=6.0,<8.0"
ruff = ">=0.8,<1.0"
respx = "^0.23.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials or external APIs, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
