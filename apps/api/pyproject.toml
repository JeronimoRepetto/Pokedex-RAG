[project]
name = "pokedex-api"
version = "0.1.0"
description = "Pokédex AI service: record cards, search and RAG chat"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "pokedex-common",
    "pokedex-db",
]

[tool.poetry]
packages = [{ include = "api", from = "src" }]

[tool.poetry.dependencies]
pokedex-common = { path = "../../libs/common", develop = true }
pokedex-db = { path = "../../libs/db", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
ruff = ">=0.8,<1.0"
httpx = ">=0.27,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
