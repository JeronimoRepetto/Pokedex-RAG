[project]
name = "pokedex-api"
version = "0.1.0"
description = "Pokédex AI service: record cards, search and RAG chat"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "pokedex-common",
    "pokedex-db",
    "pokedex-embeddings @ file:///C:/Users/jeron/Desktop/Pokedex-RAG/libs/embeddings",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pokedex-llm @ file:///C:/Users/jeron/Desktop/Pokedex-RAG/libs/llm-gateway",
    "langgraph (>=1.2.10,<2.0.0)",
    "langfuse (>=4.14,<5.0)",
    "langchain (>=1.3.14,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "api", from = "src" }]

[tool.poetry.dependencies]
pokedex-common = { path = "../../libs/common", develop = true }
pokedex-db = { path = "../../libs/db", develop = true }
pokedex-embeddings = {develop = true}
pokedex-llm = {develop = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
ruff = ">=0.8,<1.0"
httpx = ">=0.27,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
