[project]
name = "pokedex-embeddings"
version = "0.1.0"
description = "Embedder protocol, Gemini and fake implementations, embedding-space verification"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Pinned exactly: the version the 0.6 spike verified live against pokedex-rag-504617
    # (ADR-0002). Bumping it requires re-running the verify-vertex skill.
    "google-genai (==2.16.0)",
    "pokedex-db",
]

[tool.poetry]
packages = [{ include = "pokedex_embeddings", from = "src" }]

[tool.poetry.dependencies]
pokedex-db = { path = "../db", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
ruff = ">=0.8,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
