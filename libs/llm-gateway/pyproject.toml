[project]
name = "pokedex-llm"
version = "0.1.0"
description = "Provider-independent LLM gateway: protocol, adapters, fakes, contract tests"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Same exact pin as libs/embeddings (ADR-0002 verification discipline).
    "google-genai (==2.16.0)",
]

[tool.poetry]
packages = [{ include = "pokedex_llm", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
ruff = ">=0.8,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
