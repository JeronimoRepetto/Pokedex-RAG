[project]
name = "pokedex-common"
version = "0.1.0"
description = "Shared config base, JSON logging, request-id context and response contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic (>=2.7,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
]

[tool.poetry]
packages = [{ include = "pokedex_common", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=6.0,<8.0"
ruff = ">=0.8,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real services (opt-in via RUN_INTEGRATION=1)",
    "live: needs real credentials, never run in CI",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
