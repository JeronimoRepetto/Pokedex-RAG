line-length = 100
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[lint.isort]
known-first-party = [
    "pokedex_common",
    "pokedex_db",
    "pokedex_embeddings",
    "pokedex_llm",
    "pipeline",
    "api",
    "evals",
]

[format]
quote-style = "double"
